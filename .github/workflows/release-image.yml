name: Release image (date tag)

# 日期 tag 触发：校验 → 多架构构建 → 推 Docker Hub（日期 tag + 部署指针 latest）→ 触发 Coolify 部署。
# 约定与调用见 docs/git.md 与 docs/deploy.md，实现与它们保持一致。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE: hubwu42/new-api
  COOLIFY_URL: https://coolify.gosail.tech

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      is_dry: ${{ steps.tag.outputs.is_dry }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and its source
        id: tag
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 形状、当日序号、倒序发布由脚本判定；它认 GITHUB_ACTIONS/GITHUB_REF，
          # 对触发本次运行的那个 tag 不做「已用」判定。
          bash scripts/release-tag.sh --check "$RAW_TAG"

          # tag 必须切在 main 上
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

          image_tag="${RAW_TAG#v}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          case "$RAW_TAG" in
            *-dry.*) echo "is_dry=true" >> "$GITHUB_OUTPUT" ;;
            *)       echo "is_dry=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build & push (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.verify.outputs.image_tag }}-${{ matrix.arch }}

  manifest:
    name: Publish manifests
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge per-arch images into the release tag
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
          IS_DRY: ${{ needs.verify.outputs.is_dry }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"

          # 部署指针只在正式发布时刷新；干跑只留自己的日期 tag。
          #
          # linksail 是 Coolify 的 compose 型 service，它的 compose 现在引的是
          # `hubwu42/new-api:custom`（历史遗留的指针名）；service 的 compose 改不了
          # （API 面不提供，只能走面板），所以这里继续刷新这个指针，让部署一步到位。
          # 想换成 `latest`：在面板把 compose 的镜像行改成 `hubwu42/new-api:latest`，
          # 再把下面这行删掉、并同时改 docs/deploy.md。
          if [ "$IS_DRY" != "true" ]; then
            for pointer in latest custom; do
              docker buildx imagetools create -t "${IMAGE}:${pointer}" \
                "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
            done
          fi

          echo "### 镜像" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${TAG}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy linksail
    needs: [verify, manifest]
    if: needs.verify.outputs.is_dry != 'true'
    runs-on: ubuntu-latest
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - name: Check Coolify credentials
        id: gate
        run: |
          set -euo pipefail
          if [ -n "${COOLIFY_TOKEN:-}" ] && [ -n "${COOLIFY_APP_UUID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COOLIFY_TOKEN / COOLIFY_APP_UUID 未配齐，跳过部署（镜像已推送，可手动部署）"
            echo "> :warning: deploy 跳过：Coolify 凭据未配齐 —— 部署还没接好。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trigger Coolify deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # linksail 是 compose 型 service，镜像由它的 compose 指向 latest；
          # /api/v1/deploy 会让 Coolify 重新拉取并重建（只收 POST，GET 返 405）。
          out=$(curl -fsS -X POST -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")
          echo "$out"
          echo "- 已触发 Coolify 部署：\`$out\`" >> "$GITHUB_STEP_SUMMARY"
