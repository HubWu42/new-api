name: Release image (date tag)

# 日期 tag 触发：校验 → 多架构构建 → 推 Docker Hub（不可变的日期 tag，另刷一个只作人肉拉取用的 latest）→ 钉住本版并触发 Coolify 部署。
# 约定与调用见 docs/git.md 与 docs/deploy.md，实现与它们保持一致。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE: hubwu42/new-api
  COOLIFY_URL: https://coolify.gosail.tech

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      is_dry: ${{ steps.tag.outputs.is_dry }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and its source
        id: tag
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 形状、当日序号、倒序发布由脚本判定；它认 GITHUB_ACTIONS/GITHUB_REF，
          # 对触发本次运行的那个 tag 不做「已用」判定。
          bash scripts/release-tag.sh --check "$RAW_TAG"

          # tag 必须切在 main 上
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

          image_tag="${RAW_TAG#v}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          case "$RAW_TAG" in
            *-dry.*) echo "is_dry=true" >> "$GITHUB_OUTPUT" ;;
            *)       echo "is_dry=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build & push (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dockerfile 会把仓库根的 VERSION 编进二进制（Go 的 -X common.Version）与前端
      # （VITE_REACT_APP_VERSION）。仓里那个文件是空的，不写就等于发布产物没有版本号。
      - name: Write release identity into VERSION
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
        run: printf '%s' "$TAG" > VERSION

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.verify.outputs.image_tag }}-${{ matrix.arch }}

  manifest:
    name: Publish manifests
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge per-arch images into the release tag
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
          IS_DRY: ${{ needs.verify.outputs.is_dry }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"

          # 部署指针只在正式发布时刷新；干跑只留自己的日期 tag。
          # 指针就一个 `latest`；linksail 那边的 application 会按本次发布把
          # docker_registry_image_tag 钉到具体日期 tag，`latest` 只作人肉拉取用。
          if [ "$IS_DRY" != "true" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          fi

          echo "### 镜像" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # 自检：产物里必须真的能搜到本次发布标识，否则这一版不许往正式发布走。
      - name: Verify the embedded release identity
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${IMAGE}:${TAG}-amd64" > /dev/null
          count=$(docker run --rm --entrypoint /bin/grep "${IMAGE}:${TAG}-amd64" -ac "$TAG" /new-api || true)
          echo "镜像内嵌版本字符串出现次数：${count}"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::镜像里搜不到本次发布标识 ${TAG}"
            exit 1
          fi
          echo "- 版本自检通过：镜像内嵌 \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy linksail
    needs: [verify, manifest]
    if: needs.verify.outputs.is_dry != 'true'
    runs-on: ubuntu-latest
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - name: Check Coolify credentials
        id: gate
        run: |
          set -euo pipefail
          if [ -n "${COOLIFY_TOKEN:-}" ] && [ -n "${COOLIFY_APP_UUID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COOLIFY_TOKEN / COOLIFY_APP_UUID 未配齐，跳过部署（镜像已推送，可手动部署）"
            echo "> :warning: deploy 跳过：Coolify 凭据未配齐 —— 部署还没接好。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pin the release on Coolify and deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Accept: application/json")

          # linksail 是 Docker Image 型 application：先把镜像 tag 钉到本次发布，
          # 再触发部署。这条路径 Coolify 会按 docker_registry_image_tag 真的去拉取；
          # compose 型 service 做不到这一点（它只在本地镜像里找，2026-08-03 那次
          # 就是重建了容器却还跑旧镜像）。
          curl -fsS -X PATCH "${auth[@]}" -H 'Content-Type: application/json' \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}" \
            --data "{\"docker_registry_image_tag\":\"${{ needs.verify.outputs.image_tag }}\"}"

          # /api/v1/deploy 只收 POST（GET 返 405）。
          out=$(curl -fsS -X POST "${auth[@]}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")
          echo "$out"
          echo "- 已钉版本 \`${{ needs.verify.outputs.image_tag }}\` 并触发部署" >> "$GITHUB_STEP_SUMMARY"
